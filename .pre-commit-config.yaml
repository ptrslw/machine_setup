repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]

  # Scan commits for API-key-like patterns before they land. See docs/secrets.md.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # shellcheck has no zsh support. Left in, it parses these as bash and
        # reports the zsh-only syntax they exist to hold — e.g. SC2206 on
        # `fpath=(...)`. Excluded rather than suppressed line by line.
        exclude: ^home/\.(zshrc|zprofile)$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: [-i, "4", -ci]
