# tmux config. WezTerm launches into this; prefix stays Ctrl+b
# (WezTerm defines no leader of its own — see home/.wezterm.lua).

# Advertise truecolor so vim/neovim and WezTerm colors match.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,wezterm:Tc"

# Splits: | horizontal, - vertical. Open in the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also inherit the current directory.
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix + h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize: hold prefix once, then tap H/J/K/L.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this file without restarting tmux.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Mouse: click panes, drag borders, scroll history.
set -g mouse on

# Window/pane indexes start at 1; renumber after a close so there are no gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Large scrollback; low escape-time so vim doesn't feel laggy on Esc.
set -g history-limit 50000
set -sg escape-time 10

# Focus events help vim/neovim autoread when the pane regains focus.
set -g focus-events on

# Status bar
set -g status-style "bg=default fg=colour245"
set -g status-left "#[fg=colour110,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245] %Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=colour110,bold"
